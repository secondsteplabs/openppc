name: calibration

# The site check's lab against Lighthouse 13 on local pages (SITE_AUDIT_PARITY_PLAN.md, section 8): the gate the
# "uncalibrated" label waits on. Offline apart from installing; never on pull requests (hours, and CPU-bound).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      runs:
        description: loads per side per fixture
        default: "9"

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        device: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: pip install -e "companion[dev,render]"
      - run: playwright install --with-deps chromium
      - working-directory: companion/calibration
        run: npm ci --ignore-scripts
      - working-directory: companion/tests
        shell: bash  # with pipefail, so the gate's exit code survives tee
        env:
          RUNS: ${{ inputs.runs || '9' }}
          DEVICE: ${{ matrix.device }}
        run: python -m calibration.harness --device "$DEVICE" --runs "$RUNS" --lighthouse ../calibration --proxy-gate --simulate --out "$RUNNER_TEMP/calibration-$DEVICE.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: calibration-${{ matrix.device }}
          path: ${{ runner.temp }}/calibration-${{ matrix.device }}.json
          if-no-files-found: ignore
