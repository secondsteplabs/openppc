name: release-online

# Publishes the companion, openppc-online, to PyPI when a GitHub release tagged openppc-online-v* is published.
# Trusted publishing (OIDC) as in release.yml: no token is stored anywhere, and only the publish job, in the
# `pypi-online` environment, can ask for that identity. Actions are pinned to exact commits.
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    if: startsWith(github.ref_name, 'openppc-online-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: The tag must match the version in companion/pyproject.toml
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("companion/pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "openppc-online-v$version" ]; then echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; fi
      - run: python -m pip install build==1.6.1 packaging==25.0
      - name: Its openppc pin must admit the openppc in this commit
        shell: python
        run: |
          import tomllib
          from packaging.requirements import Requirement
          core = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          deps = tomllib.load(open("companion/pyproject.toml", "rb"))["project"]["dependencies"]
          pin = next(Requirement(d) for d in deps if Requirement(d).name == "openppc")
          assert pin.specifier.contains(core), f"openppc {core} is outside the companion's pin {pin.specifier}"
      - run: python tools/stage_companion_web.py
      - run: python -m build companion
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: companion/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-online
      url: https://pypi.org/p/openppc-online
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
