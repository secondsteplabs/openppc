name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13", "3.14"]  # 3.14 is what the browser app runs, via Pyodide
        include:  # web/engine.js must build byte for byte the same on every OS
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,mcp]"
      - run: ruff check openppc tests tools
      - run: mypy  # the stable engine API (ADR-2); the files are listed in pyproject.toml
      - run: pytest -q

  companion:  # openppc-online, against the openppc in this commit (its pin waits for the core's next release)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
      - run: pip install -e ".[dev]"
      - run: pip install --no-deps -e companion
      - run: pip install jsonschema==4.26.0  # the companion's dev extra; --no-deps above leaves it out
      - run: ruff check companion
      - run: pytest -q companion  # with the Tag Inspector's Node tests (the runners have Node) and the plugin's PHP tests
      - run: python tools/stage_companion_web.py
      - run: pip install build==1.6.1
      - run: python -m build companion
      - name: The wheel carries the app, the local files, the site check's data files and the license
        shell: python
        run: |
          import glob, zipfile
          names = set(zipfile.ZipFile(glob.glob("companion/dist/*.whl")[0]).namelist())
          need = {f"openppc_online/web/{f}" for f in ("index.html", "app.js", "engine.js", "engine-worker.js", "style.css")}
          need |= {"openppc_online/local/local.js", "openppc_online/local/site.js", "openppc_online/local/site.css",
                   "openppc_online/siteaudit/signatures.json",
                   "openppc_online/siteaudit/vendor/axe.min.js"}
          need |= {f"openppc_online/schemas/site-{f}.schema.json" for f in ("config", "report")}
          missing = need - names
          assert not missing, missing
          assert any(n.endswith("/licenses/LICENSE") for n in names), "no LICENSE"

  wordpress:  # the Site Check plugin on the oldest PHP it supports and on newer ones, and WordPress's coding standards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.3", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php -l companion/wordpress/openppc-site-check/openppc-site-check.php
      - run: php companion/tests/php/site_check_test.php
      - if: matrix.php == '8.3'
        working-directory: companion/wordpress
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpcs

  action:  # action.yml from this commit, the way a user's workflow runs it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: invented  # the sample AI audit has wrong numbers on purpose: the action must fail the step
        uses: ./
        continue-on-error: true
        with:
          audit: examples/ai_audit_sample.md
          data: examples/search_terms_acme.csv
          industry: home-services
          sarif: ${{ runner.temp }}/openppc.sarif
      - env:
          OUTCOME: ${{ steps.invented.outcome }}
        run: |
          test "$OUTCOME" = failure
          python -c "import json, os; assert json.load(open(os.environ['RUNNER_TEMP'] + '/openppc.sarif'))['runs'][0]['results']"
          openppc audit search-term-waste examples/search_terms_acme.csv --out "$RUNNER_TEMP/report.md"
      - uses: ./  # an OpenPPC report passes: every number traces to the export
        with:
          audit: ${{ runner.temp }}/report.md
          data: examples/search_terms_acme.csv

  docker:  # both images build, and they run with no network at all
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t openppc .
      - run: docker build --target mcp -t openppc-mcp .
      - run: docker run --rm --network none openppc audit search-term-waste --sample
      - run: docker run --rm --network none -v "$PWD/examples:/data:ro" openppc audit keyword-audit keywords_acme.csv
      - run: |  # the sample AI audit has wrong numbers on purpose: exit 2
          status=0
          docker run --rm --network none openppc check --sample || status=$?
          test "$status" = 2
      - run: |  # the command line image has no MCP SDK; the MCP image has it and its server loads
          docker run --rm --network none --entrypoint python openppc -c "import importlib.util as u; assert u.find_spec('mcp') is None"
          docker run --rm --network none --entrypoint python openppc-mcp -c "import openppc.mcp_server as m; assert m.Server"
          docker run --rm --network none openppc-mcp --help

  web-app:  # the app in Chromium, loading its Python runtime from the CDN like a visitor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,e2e]"
      - run: pip install --no-deps -e companion
      - run: playwright install --with-deps chromium
      - run: pytest -m e2e tests/e2e -q
      - run: pytest -m e2e companion/tests -q  # the same app served by openppc-online app, and the Tag Inspector
