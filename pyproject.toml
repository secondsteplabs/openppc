[project]
name = "openppc"
version = "0.1.9"
description = "Read-only Google Ads audits where every number is traced back to your own export."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shivendra Rawat" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["google-ads", "ppc", "audit", "mcp", "fact-check"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://openppc.si"
Documentation = "https://openppc.si/docs/"
Repository = "https://github.com/secondsteplabs/openppc"
Issues = "https://github.com/secondsteplabs/openppc/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
openppc = "openppc.cli:main"
openppc-mcp = "openppc.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openppc"]

[tool.hatch.build.targets.wheel.force-include]
# The made-up sample ships in the wheel, so `openppc audit <template> --sample` works after a plain pip install.
"examples/search_terms_acme.csv" = "openppc/samples/search_terms_acme.csv"
"examples/keywords_acme.csv" = "openppc/samples/keywords_acme.csv"
"examples/account_structure_acme.json" = "openppc/samples/account_structure_acme.json"
"examples/account_acme.json" = "openppc/samples/account_acme.json"
"examples/ai_audit_sample.md" = "openppc/samples/ai_audit_sample.md"

[tool.hatch.build.targets.sdist]
# An allowlist: the source archive on PyPI holds only what builds and explains the package. Hatch reads only the
# root .gitignore, so without this, local tool folders (a code graph holding absolute paths, caches) would ship too.
include = ["/openppc", "/examples", "/rulebook", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
